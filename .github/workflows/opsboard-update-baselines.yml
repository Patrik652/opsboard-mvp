name: opsboard update visual baselines

# Manually-dispatched helper: regenerates the Playwright visual baselines on a
# GitHub runner (the canonical CI environment) and uploads them as an artifact.
# Sub-pixel font rasterization differs between a developer machine and the
# runner even inside the same pinned container, so baselines must be generated
# here. Download the artifact, commit it, and the guardrail workflow will pass.
# See opsboard/docs/design-guardrail.md.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: opsboard

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Regenerate baselines
        run: npm run verify:visual:update

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: opsboard-baselines
          path: opsboard/tests/visual/__screenshots__/
          retention-days: 1
